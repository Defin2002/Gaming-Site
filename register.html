<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Registration Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

    <style>
        /* Loader */
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: #00ffd5;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
            font-family: 'Orbitron', sans-serif;
        }

        #loading-logo {
            width: 100px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0); }
            100% { transform: rotate(360deg); }
        }

        /* Base styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .form-container {
            background: #1e1e1e;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 255, 213, 0.2);
            width: 100%;
            max-width: 600px;
            transition: 0.3s ease;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #00ffd5;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 6px;
            background-color: #333;
            color: #fff;
            box-sizing: border-box;
            transition: border 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus,
        input[type="file"]:focus {
            outline: none;
            border-color: #00ffd5;
            box-shadow: 0 0 10px rgba(0, 255, 213, 0.5);
        }

        .gender-options {
            display: flex;
            gap: 15px;
            margin: 5px 0 15px;
        }

        .gender-options label {
            font-weight: normal;
        }

        input[type="radio"] {
            margin-right: 5px;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        input[type="submit"],
        input[type="reset"] {
            width: 48%;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        input[type="submit"] {
            background-color: #28a745;
            color: white;
        }

        input[type="reset"] {
            background-color: #dc3545;
            color: white;
        }

        input[type="submit"]:hover {
            background-color: #218838;
        }

        input[type="reset"]:hover {
            background-color: #c82333;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 30px 40px;
            }

            input[type="submit"],
            input[type="reset"] {
                font-size: 14px;
            }
        }

        /* Animation for Form */
        .form-container {
            opacity: 0;
            transform: scale(0.8);
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>

    <script>
        // Hide loader on window load
        window.addEventListener('load', function () {
            document.getElementById('loading-screen').style.display = 'none';
            document.querySelector('.form-container').style.animation = 'fadeIn 1s forwards';
        });
    </script>
</head>
<body>

<!-- Loading screen -->
<div id="loading-screen">
    <img id="loading-logo" src="https://cdn-icons-png.flaticon.com/512/1055/1055672.png" alt="Logo">
    <p>Loading Registration Form...</p>
</div>

<!-- Form -->
<div class="form-container">
    <h2>Game Registration Form</h2>
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required>

        <label>Gender:</label>
        <div class="gender-options">
            <label><input type="radio" name="gender" value="Male" required> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
            <label><input type="radio" name="gender" value="Other"> Other</label>
        </div>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>

        <label for="gameplay">Upload Your Gameplay:</label>
        <input type="file" id="gameplay" name="gameplay" accept="video/*,image/*" required>

        <div class="buttons">
            <input type="reset" value="Reset">
            <input type="submit" value="Submit">
        </div>
    </form>
</div>

</body>
</html>
